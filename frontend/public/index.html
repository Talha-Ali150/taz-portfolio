<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f6f7f3" />
    <meta name="description" content="Talha Ali is a full stack developer building thoughtful, responsive digital experiences with React, Node.js, and MongoDB." />
    <meta property="og:title" content="Talha Ali | Full Stack Developer" />
    <meta property="og:description" content="Explore Talha Ali’s selected web development projects and experience." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <script>
      try {
        const savedTheme = localStorage.getItem("portfolio-theme");
        const theme = savedTheme || (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
      } catch (_) {}
    </script>
    <title>Talha Ali | Full Stack Developer</title>
  </head>

    <noscript>You need to enable JavaScript to run this portfolio.</noscript>
